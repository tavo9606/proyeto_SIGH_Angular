<!-- Contenedor principal centrado con fondo degradado -->
<div class="login-page">
  <div class="formulario">

    <!-- Logo del hospital -->
    <div class="logo-container">
      <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" alt="Logo" />
    </div>
    <h2 class="nombre-hospital">Hospital Vida Sana</h2>
    <h1>Inicio de Sesión</h1>

    <!-- (ngSubmit) llama a handleSubmit() cuando el usuario presiona el botón -->
    <form (ngSubmit)="handleSubmit()" class="col1" style="margin-bottom: 0">

      <!-- Campo usuario: [(ngModel)] vincula el input con form.usuario en tiempo real -->
      <div class="input-box">
        <input type="text" id="usuario" [(ngModel)]="form.usuario" name="usuario" required />
        <label for="usuario">Usuario</label>
      </div>

      <!-- Selector de rol: determina a qué panel se redirige al hacer login -->
      <div class="rol-container">
        <label for="rol">Identificarse como:</label>
        <select id="rol" [(ngModel)]="form.rol" name="rol" required>
          <option value="">-- Selecciona un rol --</option>
          <option value="administrador">Administrador</option>
          <option value="administrativo">Personal Administrativo</option>
          <option value="medico">Médico</option>
          <option value="enfermero">Enfermero</option>
          <option value="paciente">Paciente</option>
        </select>
      </div>

      <!-- Campo contraseña -->
      <div class="input-box">
        <input type="password" id="password" [(ngModel)]="form.password" name="password" required />
        <label for="password">Contraseña</label>
      </div>

      <!-- Mensaje de error: solo se muestra si la variable 'error' tiene contenido -->
      <p *ngIf="error" style="color: red; font-size: 13px; text-align: center">{{ error }}</p>

      <div class="recordar">
        <a href="#">¿Olvidó su contraseña?</a>
      </div>

      <!-- [disabled] deshabilita el botón mientras 'cargando' sea true -->
      <button type="submit" class="btn-login" [disabled]="cargando">
        {{ cargando ? 'Iniciando...' : 'Iniciar sesión' }}
      </button>

      <!-- Enlace para ir a la página de registro -->
      <div class="registrarse">
        ¿No tienes cuenta?
        <!-- $event.preventDefault() evita que el href="#" recargue la página -->
        <a href="#" (click)="$event.preventDefault(); irRegistro()">Regístrate</a>
      </div>

    </form>
  </div>
</div>
